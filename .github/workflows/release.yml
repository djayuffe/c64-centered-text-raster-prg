name: Publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install ACME cross-assembler
        run: |
          sudo apt-get update
          sudo apt-get install --yes acme

      - name: Rebuild and verify release assets
        run: bash tools/verify_release.sh

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            c64_centered_text_raster.prg
            SHA256SUMS.txt
            README.md
            LICENSE
            docs/runtime-frame.png
